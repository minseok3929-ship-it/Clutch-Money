name: ClutchRPG
version: ${version}
main: com.clutchrpg.core.ClutchRPGPlugin
api-version: '1.21'
author: ClutchRPG Prototype
description: 울창한 숲 기반 RPG 전투 MVP 프로토타입
commands:
  스텟:
    description: CLUTCH RPG 스텟 GUI를 엽니다.
    usage: /스텟
  가방:
    description: CLUTCH RPG 가방 안내를 표시합니다.
    usage: /가방
  도움말:
    description: CLUTCH RPG 도움말을 표시합니다.
    usage: /도움말
  crpg:
    description: CLUTCH RPG 관리자 명령어
    usage: /crpg reload|mob spawn <mobId>|boss spawn forest_guardian|item give <weaponType> <rarity>|spawnpoint add/list/remove
permissions:
  clutchrpg.admin:
    description: CLUTCH RPG 관리자 권한
    default: op
